#!/hint/bash
# shellcheck disable=2034

# Per-user overrides; inherit compiler, hardening, LTO and compression settings
# from /etc/makepkg.conf and /etc/makepkg.conf.d/*.conf.

# Parallelize makepkg's packaging steps; MAKEFLAGS is inherited separately.
NPROC="$(nproc)"

# Build in RAM-backed /tmp. Use a disk-backed BUILDDIR for very large packages.
BUILDDIR=/tmp/makepkg

# Disable separate debug packages while inheriting the other package options.
OPTIONS+=(!debug)

# Preserve the existing manual and documentation search directories.
MAN_DIRS=({usr{,/local}{,/share},opt/*}/{man,info})
DOC_DIRS=(usr/{,local/}{,share/}{doc,gtk-doc} opt/*/{doc,gtk-doc})

# vim: set ft=sh ts=2 sw=2 et:
