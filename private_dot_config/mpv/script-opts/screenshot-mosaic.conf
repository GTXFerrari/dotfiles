############################################################
# FrameGrid
############################################################

# Default binding: Shift+M
# Custom input.conf examples:
#   Ctrl+m script-message screenshot-mosaic 4 4
#   Alt+m  script-message screenshot-mosaic 4 6


############################################################
# Grid
############################################################

# The screenshot count is columns * rows.
columns=4
rows=4


############################################################
# Tile Size
############################################################

# no = use source video resolution for each tile.
# yes = resize each tile to thumb_width x thumb_height.
resize=no
thumb_width=1920
thumb_height=1080


############################################################
# HDR Tone Mapping
############################################################

# auto = tone-map HDR/BT.2020 sources to SDR.
# yes = always apply the tone-map filter.
# no = never apply the tone-map filter.
hdr_tonemap=auto
hdr_tonemap_algorithm=hable
hdr_tonemap_peak=1000
hdr_tonemap_desat=0
hdr_tonemap_npl=100


############################################################
# Theme
############################################################

# no = white background with dark text.
# yes = black background with light text.
darkmode=no


############################################################
# Spacing
############################################################

# Outer border around the mosaic.
margin=20

# Black spacing between frames.
padding=20


############################################################
# Frame Timestamps
############################################################

timestamp=no
timestamp_font=Noto Sans
timestamp_font_size=10


############################################################
# Header Metadata
############################################################

metadata=yes
metadata_title=FrameGrid
metadata_title_font=/usr/share/fonts/noto/NotoSans-Italic.ttf

# 0 = auto-scale relative to metadata_font_size.
metadata_title_font_size=0
metadata_title_gap=10
metadata_font=Noto Sans

# 0 = auto-scale based on tile width. Set a number to force a specific size.
metadata_font_size=0
metadata_header_height=360
metadata_line_spacing=2
metadata_bottom_padding=12


############################################################
# Output
############################################################

# Leave blank to use mpv's screenshot-directory if set, otherwise the video folder.
output_directory=~/Pictures/Screenshots/mpv


############################################################
# Tools
############################################################

ffmpeg_path=/usr/bin/ffmpeg


############################################################
# Behavior
############################################################

# Open the generated JPG after creation.
open_after_create=no
