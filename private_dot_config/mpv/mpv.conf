profile=quality

fs=yes
keep-open=no
force-window=immediate
osc=yes

[quality]
vo=gpu-next
# Prefer Vulkan on the RTX 4090, with OpenGL available as a fallback.
gpu-api=vulkan,opengl
profile=high-quality
# Reduce scaling halos; also included in newer mpv high-quality presets.
scale-antiring=0.6
# Chroma inherits the high-quality scaler. Keep mpv's downscaling,
# floating-point precision and dithering defaults.
tone-mapping=auto
hdr-compute-peak=yes
# Let Wayland/display capability detection decide when to signal HDR.
target-colorspace-hint=auto
gamut-mapping-mode=auto
video-sync=display-resample
hwdec=auto

# Optional fixed SDR output: mpv --profile=quality-sdr video.mkv
[quality-sdr]
profile=quality
target-colorspace-hint=no
target-trc=bt.1886
target-prim=bt.709
target-peak=100
tone-mapping=bt.2446a
gamut-mapping-mode=perceptual

# Optional for visible banding: mpv --profile=deband-mild video.mkv
# Leave off for maximum preservation of fine detail and original grain.
[deband-mild]
deband=yes
deband-iterations=1
deband-threshold=32
deband-range=16
deband-grain=8

[loop-animations]
profile-cond=filename ~= nil and (filename:lower():match("%.gif$") or filename:lower():match("%.webm$")) ~= nil
profile-restore=copy
loop-file=inf

##################
# audio settings #
##################
# Specify default audio device. You can list devices with: --audio-device=help
# The option takes the device string (the stuff between the '...').
#audio-device=alsa/default

# Do not filter audio to keep pitch when changing playback speed.
#audio-pitch-correction=no

# Output 5.1 audio natively, and upmix/downmix audio with a different format.
#audio-channels=5.1
# Disable any automatic remix, _if_ the audio output accepts the audio format.
# of the currently played file. See caveats mentioned in the manpage.
# (The default is "auto-safe", see manpage.)
#audio-channels=auto

##################
# other settings #
##################

# Pretend to be a web browser. Might fix playback with some streaming sites,
# but also will break with shoutcast streams.
#user-agent="Mozilla/5.0"

# Use a large seekable RAM cache even for local input.
#cache=yes
#
# Use extra large RAM cache (needs cache=yes to make it useful).
#demuxer-max-bytes=500M
#demuxer-max-back-bytes=100M
#
# Disable the behavior that the player will pause if the cache goes below a
# certain fill size.
#cache-pause=no
