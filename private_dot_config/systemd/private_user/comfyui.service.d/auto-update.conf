[Service]
# Update before every start/restart. Never overwrite local Git changes.
Environment=GIT_TERMINAL_PROMPT=0
TimeoutStartSec=30min
RestartSec=60
ExecStartPre=/usr/bin/bash -ec 'if test -n "$(/usr/bin/git status --porcelain --untracked-files=no)"; then echo "ComfyUI update refused: tracked files have local changes" >&2; exit 1; fi'
ExecStartPre=/usr/bin/git fetch origin master
ExecStartPre=/usr/bin/git merge --ff-only FETCH_HEAD
# Keep the existing CUDA backend; retain extra custom-node dependencies.
ExecStartPre=/usr/bin/uv pip install --python .venv/bin/python --upgrade --torch-backend cu130 --requirements requirements.txt
